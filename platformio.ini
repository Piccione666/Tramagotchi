; Tramagotchi: the next Wiener Linien departures on a round display.
; One firmware, a build per board (pick one in PlatformIO's environment switcher):
;   Tramagotchi_C3  ESP32-C3 DevKitM-1, 240x240 GC9A01 TFT, button on GPIO 5
;   Tramagotchi_S3  DHX-ESP32-S3-AM175: 466x466 CO5300 AMOLED, touch, PWR and BOOT
;                   buttons (references/DHX-ESP32-S3-AM175.md)
; What differs per board: include/board_config.h, include/pinout.h, include/screen.h
; (one drawing API over TFT_eSPI or Arduino_GFX) and src/input.cpp. Everything
; else, display.cpp included, is shared.
;
; Bundle for the flasher page (firmware/<Project>_bundle_v<version>_<date>.zip):
;   pio run -e Tramagotchi_C3 -e Tramagotchi_S3
;   pio run -e Tramagotchi_C3 -e Tramagotchi_S3 -t buildfs
;   python scripts/make_stations_tree.py && python scripts/make_bundle.py
;
; Keep default serial upload behavior for `pio run -t upload`.
; OTA targets use DEVICE_LOCAL_HOSTNAME from include/config.h:
;   pio run -e <env> -t uploadota
;   pio run -e <env> -t uploadfsota

[platformio]
src_dir = src
; A plain Build / Upload takes this one; the other is picked by name.
default_envs = Tramagotchi_C3

[env]
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
; source_id.py counts the version up (firmware_version.json) when the source
; changed; save_firmware.py saves the app as firmware/<env>_v<version>_<date>.bin
; (the file for the device page's OTA upload); save_parts.py: each build's
; bootloader, partition table, app and LittleFS image go to
; .pio/parts/<env>/ for scripts/make_bundle.py.
extra_scripts =
    pre:tools/configure_ota_target.py
    post:tools/add_uploadota_target.py
    post:scripts/source_id.py
    post:scripts/save_firmware.py
    post:scripts/save_parts.py
custom_bundle_project = Tramagotchi
custom_firmware_version = 1.0
build_flags =
    -DARDUINOJSON_USE_LONG_LONG=0
    -DARDUINOJSON_SLOT_ID_SIZE=2
    ; Route Serial to the native USB Serial/JTAG port so `pio device monitor`
    ; works over the same cable used for flashing. USB_MODE=1 selects the
    ; hardware CDC peripheral (the only one the C3 has).
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:Tramagotchi_C3]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
board_build.partitions = partitions_c3.csv
custom_bundle_name = Tramagotchi C3
custom_bundle_info = ESP32-C3 DevKitM-1 with a 240x240 GC9A01 round TFT and a button on GPIO 5
; Exact versions: a library update must never change the build silently.
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bblanchon/ArduinoJson@7.4.2
build_flags =
    ${env.build_flags}
    -DBOARD_TRAMAGOTCHI_C3
    ; TFT_eSPI display setup (GC9A01 240x240 round). USER_SETUP_LOADED makes the
    ; library skip its own User_Setup files, so the wiring lives here and survives
    ; a clean build or library reinstall instead of being edited inside .pio.
    -DUSER_SETUP_LOADED=1
    -DUSER_SETUP_ID=46
    -DGC9A01_DRIVER=1
    -DTFT_MISO=-1
    -DTFT_MOSI=3
    -DTFT_SCLK=4
    -DTFT_CS=0
    -DTFT_DC=1
    -DTFT_RST=2
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000

[env:Tramagotchi_S3]
; Arduino_GFX's CO5300 driver needs Arduino core 3.x, which the official
; espressif32 platform doesn't have: pioarduino, pinned to one release (Arduino
; 3.3.7, the same as Tami Remote), since the "stable" link moves.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-s3-devkitc-1
; 32 MB flash, 8 MB octal PSRAM: with the default qio_qspi the board boots but
; psramFound() is false.
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432
board_build.partitions = partitions_s3.csv
custom_bundle_name = Tramagotchi S3
custom_bundle_info = DHX-ESP32-S3-AM175: 1.75" round AMOLED, tap or PWR button
lib_deps =
    moononournation/GFX Library for Arduino@1.6.7
    bblanchon/ArduinoJson@7.4.2
build_flags =
    ${env.build_flags}
    -DBOARD_TRAMAGOTCHI_S3
    -DBOARD_HAS_PSRAM
