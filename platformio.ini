;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = src

[env:esp32-c3-devkitm-1]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions_custom.csv
extra_scripts =
    pre:tools/configure_ota_target.py
    post:tools/add_uploadota_target.py

; Keep default serial upload behavior for `pio run -t upload`.
; OTA targets use DEVICE_LOCAL_HOSTNAME from include/config.h:
;   pio run -t uploadota
;   pio run -t uploadfsota

; Exact versions: a library update must never change the build silently.
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bblanchon/ArduinoJson@7.4.2
build_flags =
    -DARDUINOJSON_USE_LONG_LONG=0
    -DARDUINOJSON_SLOT_ID_SIZE=2
    ; Route Serial to the C3's native USB Serial/JTAG port so `pio device
    ; monitor` works over the same cable used for flashing. USB_MODE=1 selects
    ; the hardware CDC peripheral, which is the only one the C3 has.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; TFT_eSPI display setup (GC9A01 240x240 round). USER_SETUP_LOADED makes the
    ; library skip its own User_Setup files, so the wiring lives here and survives
    ; a clean build or library reinstall instead of being edited inside .pio.
    -DUSER_SETUP_LOADED=1
    -DUSER_SETUP_ID=46
    -DGC9A01_DRIVER=1
    -DTFT_MISO=-1
    -DTFT_MOSI=3
    -DTFT_SCLK=4
    -DTFT_CS=0
    -DTFT_DC=1
    -DTFT_RST=2
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
monitor_speed = 115200
